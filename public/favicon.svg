<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F46E5" />
      <stop offset="50%" stop-color="#7C3AED" />
      <stop offset="100%" stop-color="#EC4899" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#E2E8F0" />
    </linearGradient>
  </defs>
  
  <!-- Outer Rounded Square Container -->
  <rect width="64" height="64" rx="16" fill="url(#brandGrad)" />
  
  <!-- Stylized Modern Wallet Body -->
  <rect x="14" y="20" width="36" height="26" rx="6" fill="#0B132B" />
  
  <!-- Flap -->
  <path d="M14 24C14 21.7909 15.7909 20 18 20H46C48.2091 20 50 21.7909 50 24V28H14V24Z" fill="#1C2541" />
  
