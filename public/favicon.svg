  <rect x="22" y="18" width="10" height="3" rx="1.5" fill="#4F46E5" />
  
  <!-- Glowing Coin / Chip / Fast Payout Sparkle -->
  <circle cx="40" cy="33" r="5" fill="#10B981" />
  <circle cx="40" cy="33" r="2.5" fill="#FFFFFF" />
  
  <!-- Bolt Spark -->
